[package]
name = "claude-account-switcher"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Run several Claude Code accounts on one machine, chosen per directory"
license = "MIT"
repository = "https://github.com/diananerd/claude-account-switcher"
readme = "README.md"
keywords = ["claude", "claude-code", "cli", "accounts", "profiles"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "claude-switcher"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
console = "0.15"
dialoguer = { version = "0.11", default-features = false, features = ["fuzzy-select"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
